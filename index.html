<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험용 디지털 시계</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --sub-text-color: #6c757d;
            --panel-bg: #ffffff;
            --panel-border: #dee2e6;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f8f9fa;
            --sub-text-color: #adb5bd;
            --panel-bg: #1e1e1e;
            --panel-border: #2d2d2d;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .school-logo {
            max-height: 160px;
            max-width: 500px;
            object-fit: contain;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow);
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .play-notice-btn {
            background-color: #dc3545 !important;
            color: #ffffff !important;
            font-weight: 700;
            border: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .clock-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            flex: 1;
        }

        .location-text {
            font-size: 2rem;
            color: var(--sub-text-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .time-display-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .ampm {
            font-size: 4rem;
            font-weight: 700;
            color: var(--sub-text-color);
        }

        .digital-clock {
            font-family: 'Oxanium', sans-serif;
            font-size: 11vw;
            font-weight: 700;
            display: flex;
            align-items: center;
            color: var(--text-color);
            letter-spacing: -0.02em;
        }

        .colon {
            padding: 0 0.1em;
            opacity: 0.7;
        }

        .date-display {
            font-size: 2.2rem;
            color: var(--sub-text-color);
            font-weight: 500;
            margin-top: 0.5rem;
        }

        #youtube-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .video-container {
            width: 90vw;
            height: 85vh;
            max-width: 1440px;
            max-height: 810px;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .notice-text {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        footer {
            height: 30px;
        }

        :fullscreen body, :-webkit-full-screen body {
            padding: 1.5rem;
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <div class="logo-container">
            <img src="dgu.png" class="school-logo" alt="학교 로고" onerror="this.style.display='none';">
        </div>
        <div class="controls">
            <!-- <button id="manual-play-btn" class="play-notice-btn">📢 시험 안내 영상 재생</button> -->
            <button id="theme-btn">다크 모드</button>
            <button id="fullscreen-btn">전체화면</button>
        </div>
    </header>

    <main class="clock-main">
        <div class="location-text">시험장 디지털 시계</div>
        <div class="time-display-wrapper">
            <div class="ampm" id="ampm">오전</div>
            <div class="digital-clock">
                <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>
            </div>
        </div>
        <div class="date-display" id="date">0000년 00월 00일 요일</div>
    </main>

    <div id="youtube-modal">
        <div class="notice-text"></div>
        <div class="video-container">
            <iframe id="yt-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>

    <footer></footer>

    <script>
        const youtubeVideoId = '6bNQtSp0L1U'; 
        const playDurationSeconds = 90; 
        let timerId = null;

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            const ampm = hours >= 12 ? '오후' : '오전';
            let displayHours = hours % 12;
            displayHours = displayHours ? displayHours : 12; 
            
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('hours').textContent = String(displayHours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekList = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const week = weekList[now.getDay()];

            document.getElementById('date').textContent = `${year}년 ${month}월 ${day}일 ${week}`;
        }

        function startYoutubePlayback() {
            const modal = document.getElementById('youtube-modal');
            const player = document.getElementById('yt-player');
            
            player.src = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1&enablejsapi=1`;
            modal.style.display = 'flex';

            if (timerId) clearTimeout(timerId);

            timerId = setTimeout(() => {
                modal.style.display = 'none';
                player.src = ''; 
            }, playDurationSeconds * 1000);
        }

        document.getElementById('manual-play-btn').addEventListener('click', startYoutubePlayback);

        setInterval(updateClock, 1000);
        updateClock();

        // [핵심] PC 절전 모드 및 꺼짐 방지용 안티 슬립(Anti-Sleep) 시뮬레이터
        // 3분(180,000밀리초)마다 가상의 마우스 움직임(mousemove) 이벤트를 발생시켜 PC가 깨어있는 상태를 유지하게 합니다.
        setInterval(() => {
            const simulatedEvent = new MouseEvent('mousemove', {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: Math.random() * 100,
                clientY: Math.random() * 100
            });
            document.dispatchEvent(simulatedEvent);
            
            // Wake Lock API도 주기적으로 재요청하여 방어력 강화
            if ('wakeLock' in navigator && document.visibilityState === 'visible') {
                navigator.wakeLock.request('screen').catch(() => {});
            }
        }, 180000); // 3분 주기

        const themeBtn = document.getElementById('theme-btn');
        const body = document.body;

        themeBtn.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '라이트 모드';
            } else {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '다크 모드';
            }
        });

        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    requestWakeLock();
                }).catch(err => {
                    alert(`전체화면을 실행할 수 없습니다: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator && document.visibilityState === 'visible') {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        window.addEventListener('load', requestWakeLock);
        document.addEventListener('visibilitychange', requestWakeLock);
        
        ['click', 'mousemove', 'keydown'].forEach(event => {
            document.addEventListener(event, () => {
                if (!wakeLock || wakeLock.released) {
                    requestWakeLock();
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
